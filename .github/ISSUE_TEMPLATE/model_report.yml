name: Model report / Отчёт о модели
description: Tell us whether open-uniwill-cc works on your laptop / Работает ли программа на вашем ноутбуке
title: "[Model] "
labels: ["model report"]
body:
  - type: input
    id: model
    attributes:
      label: Laptop model / Модель ноутбука
      placeholder: MAIBENBEN Tsunami Series
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: "`uwccctl status` output / вывод"
      render: text
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS / EC version (Information page) / Версии BIOS и EC
  - type: dropdown
    id: os
    attributes:
      label: OS / ОС
      multiple: true
      options: ["Windows 11", "Windows 10", "Ubuntu / Debian", "Other Linux"]
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works / Что работает
      options:
        - label: Modes and Fn mode key / Режимы и клавиша Fn
        - label: Fan curves / Кривые вентиляторов
        - label: Power limits / Лимиты мощности
        - label: Keyboard lighting / Подсветка клавиатуры
        - label: Battery limits / Пределы заряда
        - label: Switches / Переключатели
        - label: Liquid cooler / СЖО
  - type: textarea
    id: notes
    attributes:
      label: Problems, notes / Проблемы, замечания
